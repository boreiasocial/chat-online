<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Online</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <link rel="stylesheet" href="/static/style.css">

</head>
<body>

<div class="container">

    <div class="sidebar">

        <h2>🟢 Online</h2>

        <ul id="usuarios"></ul>

    </div>

    <div class="chat-area">

        <h1>💬 Chat Online</h1>

        <div id="chat"></div>

        <div class="enviar">

            <input
                id="mensagem"
                type="text"
                placeholder="Digite uma mensagem..."
                maxlength="300"
            >

            <button onclick="enviar()">
                Enviar
            </button>

        </div>

    </div>

</div>

<script>

const socket = io();

let nome = "";

while(nome.trim()==""){
    nome = prompt("Digite seu nome:");
}

socket.emit("entrar", nome);

const chat = document.getElementById("chat");
const usuarios = document.getElementById("usuarios");
const caixa = document.getElementById("mensagem");

socket.on("usuarios",(lista)=>{

    usuarios.innerHTML="";

    lista.forEach(usuario=>{

        const li=document.createElement("li");

        li.textContent="🟢 "+usuario;

        usuarios.appendChild(li);

    });

});
    socket.on("historico",(mensagens)=>{

    chat.innerHTML="";

    mensagens.forEach((dados)=>{

        const div=document.createElement("div");

        div.className="mensagem";

        div.innerHTML=
        `<b>${dados.autor}</b><br>
        ${dados.texto}<br>
        <small>${dados.hora}</small>`;

        chat.appendChild(div);

    });

    chat.scrollTop=chat.scrollHeight;

});


socket.on("mensagem",(dados)=>{

    const div=document.createElement("div");

    div.className="mensagem";

    div.innerHTML=
    `<b>${dados.autor}</b><br>
    ${dados.texto}<br>
    <small>${dados.hora}</small>`;

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;

});
function enviar(){

    if(caixa.value.trim()=="") return;

    socket.emit("mensagem",{

        autor:nome,
        texto:caixa.value.trim(),
        hora:new Date().toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        })

    });

    caixa.value="";

}
socket.on("mensagem",(dados)=>{

    const div=document.createElement("div");

    div.className="mensagem";

    const autor=document.createElement("b");
    autor.textContent=dados.autor+": ";

    const texto=document.createElement("span");
    texto.textContent=dados.texto;

    const horario=document.createElement("small");
    horario.textContent=" "+(dados.hora || "");

    div.appendChild(autor);
    div.appendChild(texto);
    div.appendChild(document.createElement("br"));
    div.appendChild(horario);

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;

});

</script>

</body>
</html>
